<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Flow Connect</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-cell: #1a1a25;
      --bg-cell-hover: #252535;
      --text-primary: #f0f0f5;
      --text-secondary: #6a6a7a;
      --accent: #4ecdc4;
      --grid-line: #2a2a3a;
      
      --color-1: #ff6b6b;
      --color-2: #4ecdc4;
      --color-3: #ffe66d;
      --color-4: #95e1d3;
      --color-5: #a29bfe;
      --color-6: #fd79a8;
      --color-7: #74b9ff;
      --color-8: #ffeaa7;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-image: 
        radial-gradient(ellipse at 20% 20%, rgba(78, 205, 196, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(165, 94, 234, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(255, 107, 107, 0.05) 0%, transparent 70%);
    }

    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      padding: 1rem;
      max-width: 100vw;
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      text-align: center;
    }

    .title {
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .level-info {
      font-family: 'Space Mono', monospace;
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-top: 0.5rem;
    }

    .stats {
      display: flex;
      gap: 2rem;
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
    }

    .stat-label {
      color: var(--text-secondary);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .stat-value {
      color: var(--accent);
      font-weight: 700;
    }

    .grid-wrapper {
      position: relative;
      background: var(--bg-secondary);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .grid {
      display: grid;
      gap: 4px;
      position: relative;
    }

    .cell {
      width: clamp(55px, 18vw, 75px);
      height: clamp(55px, 18vw, 75px);
      background: var(--bg-cell);
      border-radius: 8px;
      position: relative;
      transition: background 0.15s ease;
      cursor: pointer;
    }

    .cell:hover {
      background: var(--bg-cell-hover);
    }

    .endpoint {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60%;
      height: 60%;
      border-radius: 50%;
      box-shadow: 
        0 0 20px var(--endpoint-color),
        inset 0 2px 4px rgba(255, 255, 255, 0.3);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(1.05); opacity: 0.9; }
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      border-radius: 12px;
    }

    .controls {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      font-family: 'Outfit', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent) 0%, #3db8b0 100%);
      color: var(--bg-primary);
      box-shadow: 0 4px 15px rgba(78, 205, 196, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(78, 205, 196, 0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: var(--bg-cell);
      color: var(--text-primary);
      border: 1px solid var(--grid-line);
    }

    .btn-secondary:hover {
      background: var(--bg-cell-hover);
    }

    .btn-solution {
      background: linear-gradient(135deg, #fd79a8 0%, #a29bfe 100%);
      color: white;
    }

    .btn-solution:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(253, 121, 168, 0.3);
    }

    .level-select {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 400px;
    }

    .level-btn {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      border: 2px solid var(--grid-line);
      background: var(--bg-cell);
      color: var(--text-primary);
      font-family: 'Space Mono', monospace;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .level-btn:hover {
      border-color: var(--accent);
      background: var(--bg-cell-hover);
    }

    .level-btn.completed {
      background: linear-gradient(135deg, rgba(78, 205, 196, 0.2) 0%, rgba(78, 205, 196, 0.1) 100%);
      border-color: var(--accent);
    }

    .level-btn.current {
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(78, 205, 196, 0.3);
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 15, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      z-index: 100;
      animation: fadeIn 0.4s ease-out;
      padding: 2rem;
      overflow-y: auto;
    }

    .overlay-title {
      font-size: clamp(1.5rem, 6vw, 2.5rem);
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent) 0%, #a29bfe 50%, #fd79a8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
    }

    .flow-count {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .flow-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      opacity: 0.3;
      transition: all 0.3s ease;
    }

    .flow-indicator.complete {
      opacity: 1;
      box-shadow: 0 0 10px currentColor;
    }

    .version {
      position: fixed;
      bottom: 10px;
      right: 10px;
      font-size: 0.75rem;
      color: var(--text-secondary);
      opacity: 0.7;
      font-family: 'Space Mono', monospace;
    }

    @media (max-width: 480px) {
      .game-container {
        gap: 1rem;
      }
      
      .stats {
        gap: 1.5rem;
      }

      .controls {
        width: 100%;
        padding: 0 1rem;
      }

      .btn {
        flex: 1;
        min-width: 80px;
        padding: 0.75rem 1rem;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="game-container" id="app"></div>
  <div class="version">v3.0-alpha.2</div>

  <script>
    // ============================================================
    // LEVEL DATA WITH VERIFIED SOLUTIONS
    // ============================================================
    // Coordinate system: [x, y] where x=column (0=left), y=row (0=top)
    // Each level includes a solution object proving solvability.
    // Solution format: { colorId: [[x,y], [x,y], ...], ... }
    // ============================================================

    const LEVELS = [
      // Level 1: Tutorial (3×3, 2 colors)
      // --------------------------------
      // Solution Grid:
      //       x=0   x=1   x=2
      // y=0   [R]   [R]   [R]
      // y=1   [T]   [T]   [R]
      // y=2   [T]   [T]   [R]
      // --------------------------------
      // Red:  5 cells, Teal: 4 cells, Total: 9 = 3² ✓
      {
        id: 1,
        name: "Tutorial",
        size: 3,
        pairs: [
          { color: 1, points: [[0, 0], [2, 2]] },  // Red: top-left to bottom-right
          { color: 2, points: [[0, 1], [0, 2]] },  // Teal: left-middle to bottom-left
        ],
        solution: {
          1: [[0,0], [1,0], [2,0], [2,1], [2,2]],  // Red: 5 cells
          2: [[0,1], [1,1], [1,2], [0,2]],          // Teal: 4 cells
        }
      },
    ];

    const COLORS = {
      1: '#ff6b6b',  // Red
      2: '#4ecdc4',  // Teal
      3: '#ffe66d',  // Yellow
      4: '#95e1d3',  // Mint
      5: '#a29bfe',  // Lavender
      6: '#fd79a8',  // Pink
      7: '#74b9ff',  // Blue
      8: '#ffeaa7',  // Cream
    };

    class FlowGame {
      constructor() {
        this.currentLevel = parseInt(localStorage.getItem('flowLevel')) || 0;
        
        // Ensure currentLevel is within bounds
        if (this.currentLevel >= LEVELS.length) {
          this.currentLevel = 0;
        }
        
        this.completedLevels = new Set(JSON.parse(localStorage.getItem('flowCompleted') || '[]'));
        this.moves = 0;
        this.paths = {};
        this.currentPath = null;
        this.isDrawing = false;
        this.showingCompletion = false;
        this.solutionShown = false;
        
        this.render();
        this.setupLevel();
      }

      getColor(colorId) {
        return COLORS[colorId] || '#ffffff';
      }

      render() {
        const app = document.getElementById('app');
        const level = LEVELS[this.currentLevel];
        
        app.innerHTML = `
          <div class="header">
            <h1 class="title">Flow Connect</h1>
            <p class="level-info">Level ${this.currentLevel + 1} of ${LEVELS.length} — ${level.name}</p>
          </div>
          
          <div class="stats">
            <div class="stat">
              <span class="stat-label">Moves</span>
              <span class="stat-value" id="moves">${this.moves}</span>
            </div>
            <div class="stat">
              <span class="stat-label">Flows</span>
              <span class="stat-value" id="flows">0/${level.pairs.length}</span>
            </div>
          </div>

          <div class="flow-count" id="flowIndicators">
            ${level.pairs.map(p => `
              <div class="flow-indicator" style="background: ${this.getColor(p.color)}; color: ${this.getColor(p.color)}" data-color="${p.color}"></div>
            `).join('')}
          </div>
          
          <div class="grid-wrapper">
            <div class="grid" id="grid" style="grid-template-columns: repeat(${level.size}, 1fr)">
              ${this.renderCells(level)}
            </div>
            <canvas id="pathCanvas"></canvas>
          </div>
          
          <div class="controls">
            <button class="btn btn-secondary" id="resetBtn">Reset</button>
            <button class="btn btn-solution" id="solutionBtn">Solution</button>
            <button class="btn btn-primary" id="levelsBtn">Levels</button>
          </div>
        `;

        this.setupEventListeners();
      }

      renderCells(level) {
        let cells = '';
        for (let y = 0; y < level.size; y++) {
          for (let x = 0; x < level.size; x++) {
            const endpoint = this.getEndpoint(level, x, y);
            cells += `
              <div class="cell" data-x="${x}" data-y="${y}">
                ${endpoint ? `<div class="endpoint" style="background: ${this.getColor(endpoint)}; --endpoint-color: ${this.getColor(endpoint)}"></div>` : ''}
              </div>
            `;
          }
        }
        return cells;
      }

      getEndpoint(level, x, y) {
        for (const pair of level.pairs) {
          for (const point of pair.points) {
            if (point[0] === x && point[1] === y) {
              return pair.color;
            }
          }
        }
        return null;
      }

      setupLevel() {
        const level = LEVELS[this.currentLevel];
        this.paths = {};
        this.moves = 0;
        this.solutionShown = false;
        
        for (const pair of level.pairs) {
          this.paths[pair.color] = [];
        }

        this.resizeCanvas();
        this.updateDisplay();
      }

      resizeCanvas() {
        const grid = document.getElementById('grid');
        const canvas = document.getElementById('pathCanvas');
        if (!grid || !canvas) return;
        
        canvas.width = grid.offsetWidth;
        canvas.height = grid.offsetHeight;
      }

      setupEventListeners() {
        const grid = document.getElementById('grid');
        const resetBtn = document.getElementById('resetBtn');
        const levelsBtn = document.getElementById('levelsBtn');
        const solutionBtn = document.getElementById('solutionBtn');

        // Touch events
        grid.addEventListener('touchstart', (e) => this.handleStart(e), { passive: false });
        grid.addEventListener('touchmove', (e) => this.handleMove(e), { passive: false });
        grid.addEventListener('touchend', (e) => this.handleEnd(e));
        grid.addEventListener('touchcancel', (e) => this.handleEnd(e));

        // Mouse events
        grid.addEventListener('mousedown', (e) => this.handleStart(e));
        grid.addEventListener('mousemove', (e) => this.handleMove(e));
        grid.addEventListener('mouseup', (e) => this.handleEnd(e));
        grid.addEventListener('mouseleave', (e) => this.handleEnd(e));

        resetBtn.addEventListener('click', () => {
          this.setupLevel();
          this.render();
          this.setupLevel();
        });

        levelsBtn.addEventListener('click', () => this.showLevelSelect());
        solutionBtn.addEventListener('click', () => this.showSolution());

        window.addEventListener('resize', () => this.resizeCanvas());
      }

      getCellFromEvent(e) {
        const touch = e.touches ? e.touches[0] : e;
        const element = document.elementFromPoint(touch.clientX, touch.clientY);
        if (!element) return null;
        
        const cell = element.closest('.cell');
        if (!cell) return null;
        
        return {
          x: parseInt(cell.dataset.x),
          y: parseInt(cell.dataset.y),
          element: cell
        };
      }

      handleStart(e) {
        e.preventDefault();
        const cell = this.getCellFromEvent(e);
        if (!cell) return;

        const level = LEVELS[this.currentLevel];
        const endpoint = this.getEndpoint(level, cell.x, cell.y);
        
        let startColor = endpoint;
        
        // Check if clicking on an existing path
        if (!startColor) {
          for (const [color, path] of Object.entries(this.paths)) {
            const idx = path.findIndex(p => p.x === cell.x && p.y === cell.y);
            if (idx !== -1) {
              startColor = parseInt(color);
              this.paths[color] = path.slice(0, idx);
              break;
            }
          }
        }

        if (startColor) {
          this.isDrawing = true;
          this.currentPath = {
            color: startColor,
            cells: [...(this.paths[startColor] || [])]
          };
          
          if (endpoint && this.currentPath.cells.length === 0) {
            this.currentPath.cells.push({ x: cell.x, y: cell.y });
          } else if (endpoint) {
            const pair = level.pairs.find(p => p.color === endpoint);
            const isStart = pair.points[0][0] === cell.x && pair.points[0][1] === cell.y;
            if (!isStart && this.currentPath.cells.length > 0) {
              // Only add endpoint if adjacent to last cell (prevent diagonal jumps)
              const lastCell = this.currentPath.cells[this.currentPath.cells.length - 1];
              const dx = Math.abs(cell.x - lastCell.x);
              const dy = Math.abs(cell.y - lastCell.y);
              if ((dx === 1 && dy === 0) || (dx === 0 && dy === 1)) {
                this.currentPath.cells.push({ x: cell.x, y: cell.y });
              }
              // If not adjacent, ignore click - user must drag to reach it
            } else {
              this.currentPath.cells = [{ x: cell.x, y: cell.y }];
            }
          }
          
          this.paths[startColor] = this.currentPath.cells;
          this.moves++;
          this.solutionShown = false;  // Clear solution flag when user makes a move
          this.drawPaths();
          this.updateDisplay();
        }
      }

      handleMove(e) {
        if (!this.isDrawing || !this.currentPath) return;
        e.preventDefault();
        
        const cell = this.getCellFromEvent(e);
        if (!cell) return;

        const lastCell = this.currentPath.cells[this.currentPath.cells.length - 1];
        if (!lastCell) return;
        
        // Check if move is to an adjacent cell
        const dx = Math.abs(cell.x - lastCell.x);
        const dy = Math.abs(cell.y - lastCell.y);
        if ((dx === 1 && dy === 0) || (dx === 0 && dy === 1)) {
          // Check for backtracking
          if (this.currentPath.cells.length >= 2) {
            const prevCell = this.currentPath.cells[this.currentPath.cells.length - 2];
            if (prevCell.x === cell.x && prevCell.y === cell.y) {
              this.currentPath.cells.pop();
              this.paths[this.currentPath.color] = this.currentPath.cells;
              this.drawPaths();
              return;
            }
          }

          const level = LEVELS[this.currentLevel];
          const pair = level.pairs.find(p => p.color === this.currentPath.color);
          const isOtherEndpoint = pair && 
            ((pair.points[1][0] === cell.x && pair.points[1][1] === cell.y) ||
             (pair.points[0][0] === cell.x && pair.points[0][1] === cell.y && this.currentPath.cells.length > 1));

          // Check if cell is already in current path
          const inCurrentPath = this.currentPath.cells.some(c => c.x === cell.x && c.y === cell.y);
          if (inCurrentPath && !isOtherEndpoint) return;

          // Check for collision with other paths and erase them
          for (const [color, path] of Object.entries(this.paths)) {
            if (parseInt(color) === this.currentPath.color) continue;
            const occupied = path.some(c => c.x === cell.x && c.y === cell.y);
            if (occupied) {
              const idx = path.findIndex(c => c.x === cell.x && c.y === cell.y);
              this.paths[color] = path.slice(0, idx);
            }
          }

          this.currentPath.cells.push({ x: cell.x, y: cell.y });
          this.paths[this.currentPath.color] = this.currentPath.cells;
          this.drawPaths();
          this.updateDisplay();
          
          if (isOtherEndpoint && this.currentPath.cells.length > 1) {
            this.checkCompletion();
          }
        }
      }

      handleEnd(e) {
        this.isDrawing = false;
        this.currentPath = null;
      }

      drawPaths() {
        const canvas = document.getElementById('pathCanvas');
        const grid = document.getElementById('grid');
        if (!canvas || !grid) return;

        const ctx = canvas.getContext('2d');
        const level = LEVELS[this.currentLevel];
        const cellSize = grid.offsetWidth / level.size;
        const gap = 4;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (const [color, path] of Object.entries(this.paths)) {
          if (path.length < 1) continue;

          ctx.strokeStyle = this.getColor(parseInt(color));
          ctx.lineWidth = cellSize * 0.4;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          ctx.beginPath();
          for (let i = 0; i < path.length; i++) {
            const x = path[i].x * (cellSize + gap) + cellSize / 2 + gap / 2;
            const y = path[i].y * (cellSize + gap) + cellSize / 2 + gap / 2;
            
            if (i === 0) {
              ctx.moveTo(x, y);
            } else {
              ctx.lineTo(x, y);
            }
          }
          ctx.stroke();
        }
      }

      updateDisplay() {
        const movesEl = document.getElementById('moves');
        const flowsEl = document.getElementById('flows');
        const level = LEVELS[this.currentLevel];
        
        if (movesEl) {
          movesEl.textContent = this.solutionShown ? '—' : this.moves;
        }
        
        let completedFlows = 0;
        for (const pair of level.pairs) {
          if (this.isPathComplete(pair)) {
            completedFlows++;
            const indicator = document.querySelector(`.flow-indicator[data-color="${pair.color}"]`);
            if (indicator) indicator.classList.add('complete');
          } else {
            const indicator = document.querySelector(`.flow-indicator[data-color="${pair.color}"]`);
            if (indicator) indicator.classList.remove('complete');
          }
        }
        
        if (flowsEl) flowsEl.textContent = `${completedFlows}/${level.pairs.length}`;
      }

      isPathComplete(pair) {
        const path = this.paths[pair.color];
        if (!path || path.length < 2) return false;
        
        const start = path[0];
        const end = path[path.length - 1];
        
        const [p1, p2] = pair.points;
        
        return (
          (start.x === p1[0] && start.y === p1[1] && end.x === p2[0] && end.y === p2[1]) ||
          (start.x === p2[0] && start.y === p2[1] && end.x === p1[0] && end.y === p1[1])
        );
      }

      checkCompletion() {
        const level = LEVELS[this.currentLevel];
        
        // Check all pairs are connected
        for (const pair of level.pairs) {
          if (!this.isPathComplete(pair)) return false;
        }

        // Check all cells are filled
        const totalCells = level.size * level.size;
        let filledCells = 0;
        for (const path of Object.values(this.paths)) {
          filledCells += path.length;
        }

        if (filledCells === totalCells) {
          this.showCompletion();
          return true;
        }
        
        return false;
      }

      showCompletion() {
        if (this.showingCompletion) return;
        this.showingCompletion = true;
        
        // Don't mark as completed if solution was shown
        if (!this.solutionShown) {
          this.completedLevels.add(this.currentLevel);
          localStorage.setItem('flowCompleted', JSON.stringify([...this.completedLevels]));
        }

        setTimeout(() => {
          const overlay = document.createElement('div');
          overlay.className = 'overlay';
          overlay.innerHTML = `
            <div class="overlay-title">${this.solutionShown ? 'Solution Shown' : 'Level Complete!'}</div>
            <div class="stats">
              <div class="stat">
                <span class="stat-label">Moves</span>
                <span class="stat-value">${this.solutionShown ? '—' : this.moves}</span>
              </div>
            </div>
            <div class="controls">
              ${this.currentLevel < LEVELS.length - 1 ? 
                '<button class="btn btn-primary" id="nextLevelBtn">Next Level</button>' : 
                '<button class="btn btn-primary" id="nextLevelBtn">Play Again</button>'
              }
              <button class="btn btn-secondary" id="selectLevelBtn">Select Level</button>
            </div>
          `;
          document.body.appendChild(overlay);

          document.getElementById('nextLevelBtn').addEventListener('click', () => {
            overlay.remove();
            this.showingCompletion = false;
            if (this.currentLevel < LEVELS.length - 1) {
              this.currentLevel++;
            } else {
              this.currentLevel = 0;
            }
            localStorage.setItem('flowLevel', this.currentLevel);
            this.render();
            this.setupLevel();
          });

          document.getElementById('selectLevelBtn').addEventListener('click', () => {
            overlay.remove();
            this.showingCompletion = false;
            this.showLevelSelect();
          });
        }, 300);
      }

      showLevelSelect() {
        const overlay = document.createElement('div');
        overlay.className = 'overlay';
        overlay.innerHTML = `
          <div class="overlay-title">Select Level</div>
          <div class="level-select">
            ${LEVELS.map((level, i) => `
              <button class="level-btn ${this.completedLevels.has(i) ? 'completed' : ''} ${i === this.currentLevel ? 'current' : ''}" data-level="${i}">
                ${i + 1}
              </button>
            `).join('')}
          </div>
          <button class="btn btn-secondary" id="closeLevels" style="margin-top: 1.5rem;">Close</button>
        `;
        document.body.appendChild(overlay);

        overlay.querySelectorAll('.level-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            this.currentLevel = parseInt(btn.dataset.level);
            localStorage.setItem('flowLevel', this.currentLevel);
            overlay.remove();
            this.render();
            this.setupLevel();
          });
        });

        document.getElementById('closeLevels').addEventListener('click', () => {
          overlay.remove();
        });
      }

      showSolution() {
        const level = LEVELS[this.currentLevel];
        
        // Check if level has a solution defined
        if (!level.solution) {
          console.error('No solution defined for level', this.currentLevel);
          return;
        }
        
        // Mark that solution was shown (for scoring purposes)
        this.solutionShown = true;
        
        // Clear existing paths
        this.paths = {};
        
        // Convert solution arrays to path objects
        // Solution format: { colorId: [[x,y], [x,y], ...] }
        // Game format: { colorId: [{x, y}, {x, y}, ...] }
        for (const [colorId, pathArray] of Object.entries(level.solution)) {
          this.paths[parseInt(colorId)] = pathArray.map(([x, y]) => ({ x, y }));
        }
        
        // Redraw with solution paths
        this.drawPaths();
        
        // Update display (will show all flows as complete)
        this.updateDisplay();
        
        // Don't trigger completion overlay - let user see the solution
        // They can click Reset or Levels when done
      }
    }

    // Initialize game when DOM is ready
    document.addEventListener('DOMContentLoaded', () => {
      new FlowGame();
    });
  </script>
</body>
</html>
